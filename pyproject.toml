[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ream"
version = "1.0.0"
description = "Reliability-Aware Address Matching for cross-source geospatial entity resolution"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "transformers>=4.36",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
